[project]
name = "t9gpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.8.0",
    "pydantic>=2.12.0",
    "pyfiglet>=1.0.2",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
